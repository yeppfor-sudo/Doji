name: Crypto Scanner

on:
  schedule:
    # off-peak minute, after each 4h candle close (UTC): 00, 04, 08, 12, 16, 20
    - cron: '23 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Keep schedule alive
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "Crypto Scanner" --repo "$GITHUB_REPOSITORY" || true
