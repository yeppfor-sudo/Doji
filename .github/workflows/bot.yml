import ccxt, pandas as pd, requests, os, io, time
import matplotlib.pyplot as plt
import numpy as np
from datetime import datetime

BOT_TOKEN=os.getenv("BOT_TOKEN"); CHAT_ID=os.getenv("CHAT_ID")

def send_text(msg):
    try:
        requests.post(f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage",
            data={"chat_id":CHAT_ID,"text":msg,"parse_mode":"HTML"}, timeout=20)
        print(msg)
    except: pass

def send_photo(fig, cap):
    try:
        buf=io.BytesIO(); fig.savefig(buf,format='png',dpi=140,bbox_inches='tight')
        buf.seek(0); plt.close(fig)
        requests.post(f"https://api.telegram.org/bot{BOT_TOKEN}/sendPhoto",
            data={"chat_id":CHAT_ID,"caption":cap,"parse_mode":"HTML"},
            files={"photo":buf}, timeout=25)
    except Exception as e: print(e)

send_text(f"🚀 <b>V7 10/DAY PUMP {datetime.utcnow().strftime('%H:%M UTC')}</b>\n4H Bottom + 1H Break + 15m Pump")

def ema(s,n): return s.ewm(span=n, adjust=False).mean()
def rsi(s,p=14):
    d=s.diff(); g=(d.where(d>0,0)).ewm(alpha=1/p, adjust=False).mean()
    l=(-d.where(d<0,0)).ewm(alpha=1/p, adjust=False).mean()
    return 100-(100/(1+g/l))

def is_hammer(o,h,l,c):
    b=abs(c-o)
    if b==0 or (h-l)==0: return False
    lower=min(o,c)-l; upper=h-max(o,c)
    return lower > b*1.8 and upper < b*0.6

def scan_10_per_day(df_1d, df_4h, df_1h, df_15m):
    # 1. 1D filter - still near bottom (7/90 you liked)
    if len(df_1d)<90 or len(df_4h)<60 or len(df_1h)<60 or len(df_15m)<60:
        return None
    
    for d in [df_1d, df_4h, df_1h, df_15m]:
        d['ema20']=ema(d['c'],20); d['ema50']=ema(d['c'],50); d['rsi']=rsi(d['c'],14)
        d['vol_ma20']=d['v'].rolling(20).mean()
    
    # 1D - near 7d and 90d low (your 7/90)
    low_1d = df_1d.iloc[-6:-1]['l'].min()
    low7 = df_1d.iloc[-8:-1]['l'].min()
    low90 = df_1d.iloc[-91:-1]['l'].min()
    curr_1d = df_1d.iloc[-1]['c']
    if low_1d > low7*1.08: return None  # not near weekly low
    if low_1d > low90*1.25: return None # too high vs 90d
    if curr_1d > low_1d*1.35: return None
    if df_1d.iloc[-1]['rsi'] > 65: return None
    
    # 4H - Tight consolidation 3-8 candles + EMA cross preparing
    # Last 4H 8 candles should be tight
    w4 = df_4h.iloc[-8:]
    range_4h = w4['h'].max() - w4['l'].min()
    if range_4h / w4['c'].mean() > 0.12: return None  # too wide, need tight
    # 4H close above EMA20 or crossing
    if df_4h.iloc[-1]['c'] < df_4h.iloc[-1]['ema20']*0.98: return None
    if df_4h.iloc[-2]['c'] <= df_4h.iloc[-2]['ema20']*1.01 and df_4h.iloc[-1]['c'] > df_4h.iloc[-1]['ema20']:
        ema_cross_4h = True
    else:
        # allow if already above but close
        ema_cross_4h = df_4h.iloc[-1]['c'] > df_4h.iloc[-1]['ema20'] and (df_4h.iloc[-1]['c']-df_4h.iloc[-1]['ema20'])/df_4h.iloc[-1]['ema20'] < 0.03
        if not ema_cross_4h: return None
    
    # 1H - MAIN TRIGGER - Breakout + Volume
    last_1h = df_1h.iloc[-1]; prev_1h = df_1h.iloc[-2]
    # Volume pop 1h
    vol_pop_1h = last_1h['v'] > last_1h['vol_ma20']*1.5  # 1.5x for 1H (you wanted 1.2x, 1.5 is better for 10/day)
    # EMA20 break 1H
    ema_break_1h = last_1h['c'] > last_1h['ema20'] and prev_1h['c'] <= prev_1h['ema20']*1.015
    # Bullish candle
    bullish_1h = last_1h['c'] > last_1h['o'] and (last_1h['c']-last_1h['o'])/(last_1h['h']-last_1h['l']+1e-9) > 0.4
    # RSI
    rsi_ok_1h = 38 < last_1h['rsi'] < 68
    # Pump 24h < 12%
    pump_24h = last_1h['c'] / df_1h.iloc[-24]['c'] if len(df_1h)>=24 else 1
    if pump_24h > 1.12: return None
    
    if not (vol_pop_1h and (ema_break_1h or bullish_1h) and rsi_ok_1h): return None
    
    # 15m - CONFIRMATION - Momentum starting NOW (pump within hours)
    last_15 = df_15m.iloc[-1]; prev_15 = df_15m.iloc[-2]
    # 15m volume spike
    vol_15 = last_15['v'] > last_15['vol_ma20']*1.8
    # 15m EMA20 break
    ema_15_break = last_15['c'] > last_15['ema20'] and last_15['rsi'] > 40
    # 15m green
    if last_15['c'] <= last_15['o']: return None
    if not (vol_15 and ema_15_break): return None
    
    # All filters passed - calculate levels
    low = w4['l'].min()
    entry = last_1h['c']
    sl = low*0.965
    if sl >= entry*0.94: sl = entry*0.94  # max 6% SL
    risk = entry - sl
    if risk <=0: return None
    
    return {
        'entry': entry, 'sl': sl,
        'tp1': entry + risk*1.5,  # quick 1.5R in 2-4h
        'tp2': entry + risk*3.0,  # 3R in 6-12h
        'tp3': entry + risk*5.0,  # 5R in 12-24h
        'vol_1h': last_1h['v']/last_1h['vol_ma20'],
        'vol_15m': last_15['v']/last_15['vol_ma20'],
        'rsi_1h': last_1h['rsi'], 'rsi_15m': last_15['rsi'],
        'pump24': pump_24h, 'low': low,
        'df_1h': df_1h, 'df_15m': df_15m, 'df_4h': df_4h,
        'low7': low7, 'low90': low90
    }

def chart_pump(res, sym, exn):
    fig, (ax1, ax2, ax3) = plt.subplots(3,1, figsize=(12,8), gridspec_kw={'height_ratios': [2,1.5,1]})
    
    # 4H top
    df4 = res['df_4h'].tail(40)
    for i in range(len(df4)-1):
        row=df4.iloc[i]; col='#00b26a' if row['c']>=row['o'] else '#ff3b30'
        ax1.plot([df4.index[i],df4.index[i]],[row['l'],row['h']],color=col,lw=1)
        ax1.plot([df4.index[i],df4.index[i]],[row['o'],row['c']],color=col,lw=3)
    last=df4.iloc[-1]; li=df4.index[-1]; col_live='#00b26a' if last['c']>=last['o'] else '#ff3b30'
    ax1.plot([li,li],[last['l'],last['h']],color=col_live,lw=2,ls='--'); ax1.plot([li,li],[last['o'],last['c']],color=col_live,lw=5)
    ax1.scatter(li, last['c'], color='gold', s=250, edgecolor='black', zorder=5, marker='*')
    ax1.plot(df4.index, df4['ema20'].tail(40), color='#5b4cff', lw=1.5, label='EMA20 4H')
    ax1.axhline(res['sl'], color='red', ls='--', label=f"SL {res['sl']:.4f}")
    ax1.set_title(f"{sym} 4H Bottom {exn} 7d {res['low7']:.4f} 90d {res['low90']:.4f}", fontsize=10); ax1.legend(fontsize=6); ax1.grid(alpha=0.2)
    
    # 1H middle - main
    df1 = res['df_1h'].tail(60)
    for i in range(len(df1)-1):
        row=df1.iloc[i]; col='#00b26a' if row['c']>=row['o'] else '#ff3b30'
        ax2.plot([df1.index[i],df1.index[i]],[row['l'],row['h']],color=col,lw=1)
        ax2.plot([df1.index[i],df1.index[i]],[row['o'],row['c']],color=col,lw=3)
    last=df1.iloc[-1]; li=df1.index[-1]
    ax2.plot([li,li],[last['l'],last['h']],color=col_live,lw=2,ls='--'); ax2.plot([li,li],[last['o'],last['c']],color=col_live,lw=6,alpha=0.9)
    ax2.scatter(li, last['c'], color='gold', s=300, edgecolor='black', zorder=6, marker='*')
    ax2.plot(df1.index, df1['ema20'].tail(60), color='#ff8c00', lw=1.8, label='EMA20 1H')
    ax2.axhline(res['entry'], color='blue', ls='-', label=f"Entry {res['entry']:.4f}")
    ax2.axhline(res['tp1'], color='green', ls='-', label=f"TP1 {res['tp1']:.4f} (2-4h)")
    ax2.axhline(res['tp2'], color='darkgreen', ls='-', label=f"TP2 {res['tp2']:.4f} (6-12h)")
    ax2.set_title(f"1H BREAKOUT Vol {res['vol_1h']:.1f}x RSI {res['rsi_1h']:.0f} Pump24 {res['pump24']*100-100:.1f}%", fontsize=11, color='green', fontweight='bold')
    ax2.legend(fontsize=6); ax2.grid(alpha=0.2)
    
    # 15m bottom
    df15 = res['df_15m'].tail(60)
    for i in range(len(df15)-1):
        row=df15.iloc[i]; col='#00b26a' if row['c']>=row['o'] else '#ff3b30'
        ax3.plot([df15.index[i],df15.index[i]],[row['l'],row['h']],color=col,lw=1)
        ax3.plot([df15.index[i],df15.index[i]],[row['o'],row['c']],color=col,lw=2.5)
    last=df15.iloc[-1]; li=df15.index[-1]
    ax3.plot([li,li],[last['l'],last['h']],color=col_live,lw=2,ls='--'); ax3.plot([li,li],[last['o'],last['c']],color=col_live,lw=5)
    ax3.scatter(li, last['c'], color='gold', s=200, edgecolor='black', zorder=5, marker='*')
    ax3.plot(df15.index, df15['ema20'].tail(60), color='purple', lw=1.5, label='EMA20 15m')
    ax3.set_title(f"15m MOMENTUM Vol {res['vol_15m']:.1f}x RSI {res['rsi_15m']:.0f} -> PUMP NOW", fontsize=10, color='red')
    ax3.legend(fontsize=6); ax3.grid(alpha=0.2)
    
    plt.tight_layout()
    return fig

BLACKLIST = {'BTC','ETH','BNB','SOL','XRP','BTCDOM','SPX','STOCK'}
EXS = [
    ('MEXC', ccxt.mexc, {'enableRateLimit': True, 'options': {'defaultType': 'swap'}}),
    ('OKX', ccxt.okx, {'enableRateLimit': True, 'options': {'defaultType': 'swap'}}),
    ('GATE', ccxt.gate, {'enableRateLimit': True, 'options': {'defaultType': 'swap'}}),
    ('BITGET', ccxt.bitget, {'enableRateLimit': True, 'options': {'defaultType': 'swap'}}),
    ('BYBIT', ccxt.bybit, {'enableRateLimit': True, 'options': {'defaultType': 'swap'}}),
]

total=0; sent=set(); best=[]
for exn, cls, opts in EXS:
    try:
        ex=cls(opts); ex.load_markets()
        syms=[m['symbol'] for m in ex.markets.values() if 'USDT' in m['symbol'] and (m.get('type') in ['future','swap','linear'] or ':USDT' in m['symbol'])]
        unique=[]; seen=set()
        for s in syms:
            clean=s.split('/')[0].split(':')[0].upper()
            if clean not in seen and clean not in BLACKLIST and 'STOCK' not in s:
                seen.add(clean); unique.append(s)
        syms=unique[:400]
        send_text(f"📊 {exn}: {len(syms)} perps Scanning 10/day")
        for sym in syms:
            clean=sym.split('/')[0].split(':')[0]
            if clean.upper() in sent: continue
            try:
                ohlcv_1d=ex.fetch_ohlcv(sym,'1d',limit=100)
                ohlcv_4h=ex.fetch_ohlcv(sym,'4h',limit=80)
                ohlcv_1h=ex.fetch_ohlcv(sym,'1h',limit=100)
                ohlcv_15m=ex.fetch_ohlcv(sym,'15m',limit=100)
                if min(len(ohlcv_1d),len(ohlcv_4h),len(ohlcv_1h),len(ohlcv_15m))<60: continue
                df_1d=pd.DataFrame(ohlcv_1d,columns=['t','o','h','l','c','v'])
                df_4h=pd.DataFrame(ohlcv_4h,columns=['t','o','h','l','c','v'])
                df_1h=pd.DataFrame(ohlcv_1h,columns=['t','o','h','l','c','v'])
                df_15m=pd.DataFrame(ohlcv_15m,columns=['t','o','h','l','c','v'])
                res=scan_10_per_day(df_1d, df_4h, df_1h, df_15m)
                if not res: continue
                # Score for best 10
                score = res['vol_1h']*0.4 + res['vol_15m']*0.3 + (70-res['rsi_1h'])*0.05
                best.append((score, clean, exn, res, sym))
                sent.add(clean.upper())
            except: continue
    except Exception as e: send_text(f"⚠️ {exn} {str(e)[:120]}")

# Send only TOP 10 best by score
best_sorted = sorted(best, key=lambda x: x[0], reverse=True)[:10]
for score, clean, exn, res, sym in best_sorted:
    fig=chart_pump(res,clean,exn)
    cap=(f"⚡ <b>{clean} TOP 10 PUMP {exn}</b> Score {score:.1f}\n"
         f"1H Vol {res['vol_1h']:.1f}x 15m Vol {res['vol_15m']:.1f}x\n"
         f"Entry {res['entry']:.6f} SL {res['sl']:.6f} (-{(1-res['sl']/res['entry'])*100:.1f}%)\n"
         f"TP1 {res['tp1']:.6f} (2-4h) TP2 {res['tp2']:.6f} (6-12h) TP3 {res['tp3']:.6f}\n"
         f"7dLow {res['low7']:.4f} 90dLow {res['low90']:.4f} 24hPump {res['pump24']*100-100:.1f}%\n"
         f"🔥 PUMP WITHIN HOURS - Enter NOW")
    send_photo(fig,cap)
    total+=1
    time.sleep(0.8)

send_text(f"✅ <b>Done 10/day</b> Found {len(best)} total, Sent TOP {total}\n4H Bottom + 1H Break + 15m Momentum")
