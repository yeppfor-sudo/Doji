name: MEXC Bottom Scanner
on:
  schedule:
    - cron: '5 0 * * *'  # Daily at 5:05 AM PKT = 00:05 UTC - daily close
    - cron: '5 4,8,12,16,20 * * *' # also scan today intraday every 4h
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests pandas numpy matplotlib
      - name: Run Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
