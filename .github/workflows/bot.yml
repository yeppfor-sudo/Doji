name: Bottom Ready Watchlist

on:
  schedule:
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Restore watchlist
        uses: actions/cache/restore@v4
        with:
          path: |
            bottom_ready.json
            sent_pairs.json
          key: watchlist-${{ github.run_id }}
          restore-keys: |
            watchlist-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install ccxt pandas matplotlib requests
      
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
      
      - name: Save watchlist
        uses: actions/cache/save@v4
        with:
          path: |
            bottom_ready.json
            sent_pairs.json
          key: watchlist-${{ github.run_id }}
